name: qnyz-monitor
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qnyz-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests PyYAML
      - run: python -m unittest test_deployment.py
      - uses: actions/cache@v4
        with:
          path: flexible-state.json
          key: qnyz-flexible-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qnyz-flexible-v1-
      - name: Check flexible 15-night stays and notify WeChat
        env:
          QNYZ_NOTIFY_URL: ${{ secrets.BARK_URL }}
        run: python flexible_monitor.py
